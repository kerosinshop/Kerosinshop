<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEROSIN SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #fff);
            padding: 16px;
        }
        .product-card {
            background: var(--tg-theme-secondary-bg-color, #16213e);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .product-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .product-price { font-size: 16px; color: #00ff88; margin-bottom: 8px; }
        .product-desc { font-size: 14px; opacity: 0.7; margin-bottom: 12px; }
        .stock-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .in-stock { background: #00ff8822; color: #00ff88; }
        .low-stock { background: #ffaa0022; color: #ffaa00; }
        .out-stock { background: #ff444422; color: #ff4444; }
        .add-btn {
            width: 100%;
            padding: 12px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-btn:disabled {
            background: #555;
            color: #999;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            border: none;
            color: var(--tg-theme-text-color, #fff);
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active { background: #00ff88; color: #000; }
        .cart-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #00ff88;
            color: #000;
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,255,136,0.3);
        }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1 style="margin-bottom:16px;">🛍 KEROSIN SHOP</h1>
    
    <div class="category-tabs" id="categories"></div>
    <div id="products"></div>
    
    <button class="cart-icon" onclick="viewCart()">
        🛒<span class="cart-count" id="cartCount">0</span>
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let cart = {};
        let products = @PRODUCTS_JSON@; // Заменится при сборке
  
let products = [];

async function loadProducts() {
    try {
        const response = await fetch('https://kerosinshop-kerosinshopingtg.amvera.io/');
        if (response.ok) {
            products = await response.json();
            renderCategories();
        }
    } catch(e) {
        console.log('Ошибка загрузки, пробуем снова...');
        setTimeout(loadProducts, 3000);
    }
}

        
        function renderCategories() {
            const cats = [...new Set(products.map(p => p.category))];
            document.getElementById('categories').innerHTML = cats.map((c, i) => 
                `<button class="tab ${i===0?'active':''}" onclick="filterByCategory('${c}', this)">${c}</button>`
            ).join('');
            renderProducts(products);
        }
        
        function filterByCategory(cat, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(products.filter(p => p.category === cat));
        }
        
        function renderProducts(list) {
            document.getElementById('products').innerHTML = list.map(p => {
                let stockClass = p.stock > 10 ? 'in-stock' : (p.stock > 0 ? 'low-stock' : 'out-stock');
                let stockText = p.stock > 10 ? `В наличии: ${p.stock} шт` : (p.stock > 0 ? `Осталось: ${p.stock} шт` : 'Нет в наличии');
                return `
                <div class="product-card">
                    <div class="product-name">📦 ${p.name}</div>
                    <div class="product-price">💰 ${p.price} ₽</div>
                    <div class="product-desc">${p.description || ''}</div>
                    <span class="stock-badge ${stockClass}">${stockText}</span>
                    <br>
                    <button class="add-btn" ${p.stock === 0 ? 'disabled' : ''} onclick="addToCart(${p.id})">
                        ${p.stock > 0 ? '🛒 Добавить в корзину' : '❌ Нет в наличии'}
                    </button>
                </div>`;
            }).join('');
        }
        
        function addToCart(productId) {
            if (!cart[productId]) {
                let product = products.find(p => p.id === productId);
                cart[productId] = { ...product, quantity: 1 };
            } else {
                cart[productId].quantity++;
            }
            updateCartCount();
            tg.HapticFeedback.impactOccurred('light');
            tg.showPopup({title: '✅ Добавлено!', message: 'Товар в корзине', buttons: [{type: 'ok'}]});
        }
        
        function updateCartCount() {
            let total = Object.values(cart).reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = total;
        }
        
        function viewCart() {
            let total = Object.values(cart).reduce((sum, item) => sum + item.price * item.quantity, 0);
            let items = Object.values(cart).map(item => 
                `${item.name} x${item.quantity} = ${item.price * item.quantity}₽`
            ).join('\n');
            
            tg.showPopup({
                title: '🛒 Корзина',
                message: items ? `${items}\n\n💰 Итого: ${total}₽` : 'Корзина пуста',
                buttons: [
                    {id: 'checkout', type: 'default', text: '✅ Оформить заказ'},
                    {id: 'clear', type: 'destructive', text: '🗑 Очистить'},
                    {type: 'cancel'}
                ]
            }, (btnId) => {
                if (btnId === 'checkout' && Object.keys(cart).length > 0) {
                    tg.sendData(JSON.stringify({action: 'checkout', cart: cart}));
                    tg.close();
                } else if (btnId === 'clear') {
                    cart = {};
                    updateCartCount();
                }
            });
        }
        
        loadProducts()
    </script>
</body>
</html>
